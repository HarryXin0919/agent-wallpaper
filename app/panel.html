<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' file:;">
<title>Agent Wallpaper</title>
<script src="../src/platform.js"></script>
<style>
/* the same look as the settings window: neutral greys, one accent, light or dark after the system */
:root { color-scheme: dark;
  --bg: #1c1c1e; --line: rgba(255, 255, 255, .08); --text: #f2f2f4; --dim: #9d9da6; --faint: #6f6f78;
  --fill: rgba(255, 255, 255, .07); --track: rgba(255, 255, 255, .13); --bar: #e9e9ee; --acc: #3d7bff;
  --wait: #e8b04a; --err: #ff8a8a; --ok: #5fd08f;
  --ff: "Segoe UI Variable Text", "Segoe UI", system-ui, "Microsoft YaHei UI", "PingFang SC", sans-serif; }
@media (prefers-color-scheme: light) {
  :root { color-scheme: light;
    --bg: #f8f8fa; --line: rgba(0, 0, 0, .09); --text: #1d1d1f; --dim: #696971; --faint: #9a9aa3;
    --fill: rgba(0, 0, 0, .055); --track: rgba(0, 0, 0, .12); --bar: #3a3a40; --acc: #2f6ef2;
    --wait: #a86a00; --err: #c0392b; --ok: #1f8f55; }
}
* { box-sizing: border-box; margin: 0; }
html, body { background: transparent; overflow: hidden; }
body { color: var(--text); font: 13px/1.4 var(--ff); user-select: none; -webkit-font-smoothing: antialiased; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: -2px; }
#panel { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
section { padding: 12px 16px; }
section + section { border-top: 1px solid var(--line); }
h2 { font-size: 11.5px; font-weight: 500; color: var(--faint); margin: 2px 0 4px; }
h2:not(:first-child) { margin-top: 12px; }

/* quotas: one line each */
.q { display: grid; grid-template-columns: 112px 1fr auto; align-items: center; gap: 12px; padding: 4px 0; }
.q .n { color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.q .n i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--c); margin-right: 7px; vertical-align: 1px; }
.q .v { white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; min-width: 64px; }
.q .v.fc { color: var(--wait); }
.bar { height: 4px; border-radius: 99px; background: var(--track); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: var(--bar); }
.q .bar i { background: var(--c); }
.q.warm .bar i { background: var(--wait); } .q.hot .bar i { background: var(--err); }

/* tasks */
.t { display: block; text-align: left; border: 0; background: none; color: inherit; font: inherit; padding: 8px 10px; margin: 0 -10px; width: calc(100% + 20px);
  border-radius: 8px; cursor: pointer; transition: background .15s; }
.t:hover { background: var(--fill); }
.t .l1 { display: flex; align-items: center; gap: 8px; }
.t .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); flex: none; }
.t .ti { flex: 1; min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t .st { flex: none; max-width: 46%; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.t.approve .st, .t.reply .st { color: var(--wait); } .t.stuck .st { color: var(--err); } .t.done .st { color: var(--ok); }
.t .l2 { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; margin: 7px 0 0 15px; }
.t .l2 span { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.t .l2 b { color: var(--text); font-weight: 600; margin-right: 6px; }
.t.done .ti { color: var(--dim); font-weight: 400; }
.empty { color: var(--dim); padding: 6px 0 4px; line-height: 1.6; }
.empty b { color: var(--text); display: block; font-size: 13.5px; font-weight: 500; margin-bottom: 4px; }

/* the actions at the bottom */
.acts { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); }
.acts button { border: 0; background: none; color: var(--dim); font: inherit; font-size: 12.5px; padding: 6px 8px; border-radius: 7px; cursor: pointer; transition: background .15s, color .15s; }
.acts button:hover { background: var(--fill); color: var(--text); }
.acts kbd { font: 11px "Cascadia Mono", Consolas, monospace; color: var(--faint); margin-left: 6px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* ---- macOS: a menu bar pop-up. The window itself is the system's popover material with its own corners and
   shadow (main.mjs), so the page draws no background or border; the system colours and font. ---- */
.mac { --bg: transparent; --line: rgba(255, 255, 255, .10); --text: rgba(255, 255, 255, .88); --dim: rgba(235, 235, 245, .60); --faint: rgba(235, 235, 245, .42);
  --fill: rgba(255, 255, 255, .09); --track: rgba(255, 255, 255, .14); --bar: rgba(255, 255, 255, .88); --acc: #0a84ff;
  --wait: #ff9f0a; --err: #ff453a; --ok: #30d158; --ff: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; }
@media (prefers-color-scheme: light) {
  .mac { --line: rgba(0, 0, 0, .10); --text: rgba(0, 0, 0, .86); --dim: rgba(60, 60, 67, .68); --faint: rgba(60, 60, 67, .48);
    --fill: rgba(0, 0, 0, .07); --track: rgba(0, 0, 0, .11); --bar: rgba(0, 0, 0, .78); --acc: #007aff;
    --wait: #b25000; --err: #d70015; --ok: #248a3d; }
}
.mac #panel { background: none; border: 0; border-radius: 0; }
.mac section { padding: 10px 14px; }
.mac h2 { font-size: 11px; font-weight: 600; }
.mac .t { border-radius: 6px; }
.mac .acts { padding: 6px 8px; }
.mac .acts button { border-radius: 6px; font-size: 13px; }
.mac .acts kbd { font: 12px var(--ff); letter-spacing: .5px; }
</style>
</head>
<body>
<div id="panel"></div>
<script src="../src/i18n.js"></script>
<script src="../src/scene.js"></script>
<script src="../src/flow.js"></script>
<script src="../src/fontface.js"></script>
<script src="panel.js"></script>
</body>
</html>
